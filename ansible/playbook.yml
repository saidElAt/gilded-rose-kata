---
- name: Deploy Gilded Rose
  hosts: targets
  become: true

  vars:
    app_directory: /opt/gilded-rose
    app_jar: gilded-rose-kata.jar

  tasks:

    - name: Install Java runtime
      ansible.builtin.apt:
        name: openjdk-21-jre-headless
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_directory }}"
        state: directory
        owner: ansible
        group: ansible
        mode: '0755'

    - name: Deploy application JAR
      ansible.builtin.copy:
        src: /workspace/target/gilded-rose-kata-1.0-SNAPSHOT.jar
        dest: "{{ app_directory }}/{{ app_jar }}"
        owner: ansible
        group: ansible
        mode: '0644'

    - name: Run Gilded Rose smoke test
      ansible.builtin.command:
        cmd: "java -jar {{ app_directory }}/{{ app_jar }}"
      register: gilded_rose_output
      changed_when: false

    - name: Display application output
      ansible.builtin.debug:
        var: gilded_rose_output.stdout_lines